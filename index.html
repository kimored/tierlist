<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TierList">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230a0a0f' width='100' height='100' rx='20'/><text x='50' y='68' text-anchor='middle' font-size='50' font-weight='bold' fill='%2300e5ff'>T</text></svg>">
<title>TierList</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--surface3:#282840;
  --text:#e8e8f0;--text2:#8888a0;--accent:#00e5ff;--accent2:#7c4dff;
  --s:#ff1744;--a:#ff9100;--b:#ffea00;--c:#69f0ae;--d:#448aff;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--surface3);border-radius:8px;padding:8px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}

.app-header{position:sticky;top:0;z-index:100;background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--surface3);padding:12px 16px;display:flex;align-items:center;gap:12px}
.app-header h1{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
.btn{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);border:1px solid var(--surface3)}
.btn-secondary:hover{border-color:var(--accent)}
.btn-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:20px;background:var(--surface2);border:1px solid var(--surface3)}
.btn-icon:hover{border-color:var(--accent);background:var(--surface3)}
.btn-danger{background:#ff174422;color:var(--s);border:1px solid #ff174444}
.btn-danger:hover{background:#ff174444}

/* ── HOME ── */
.home{padding:16px;max-width:800px;margin:0 auto}
.home-title{font-size:28px;font-weight:800;margin:20px 0 8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-subtitle{color:var(--text2);margin-bottom:24px;font-size:14px}
.list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.list-card{background:var(--surface);border:1px solid var(--surface3);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.list-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .25s}
.list-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.list-card:hover::before{opacity:1}
.list-card-name{font-size:16px;font-weight:700;margin-bottom:4px;padding-right:60px}
.list-card-count{font-size:13px;color:var(--text2)}
.list-card-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.list-card-actions button{width:32px;height:32px;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--surface3);transition:all .2s;opacity:.6}
.list-card-actions button:hover{opacity:1;border-color:var(--accent)}
.add-card{border:2px dashed var(--surface3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text2);min-height:100px}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.add-card .plus{font-size:32px;font-weight:300;line-height:1}

/* ── TIER VIEW ── */
.tier-view{display:none;flex-direction:column;height:100%}
.tier-view.active{display:flex}
.tier-header{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--surface3);display:flex;align-items:center;gap:12px}
.tier-header .back{font-size:24px}
.tier-title-input{font-size:18px;font-weight:700;background:transparent;border:none;padding:4px 0;width:100%;color:var(--text)}
.tier-title-input:focus{border-bottom:2px solid var(--accent)}

.tier-container{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.tier-row{display:flex;margin-bottom:8px;border-radius:var(--radius);overflow:hidden;background:var(--surface);min-height:80px}
.tier-label{width:60px;min-width:60px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#000;flex-shrink:0;user-select:none}
.tier-label[data-tier="S"]{background:var(--s)}
.tier-label[data-tier="A"]{background:var(--a)}
.tier-label[data-tier="B"]{background:var(--b)}
.tier-label[data-tier="C"]{background:var(--c)}
.tier-label[data-tier="D"]{background:var(--d)}
.tier-items{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:8px;min-height:80px;transition:background .2s}
.tier-items.drag-over{background:rgba(0,229,255,.08);outline:2px dashed var(--accent);outline-offset:-2px;border-radius:0 var(--radius) var(--radius) 0}

.unranked{background:var(--surface);border-radius:var(--radius);margin-top:8px;padding:12px}
.unranked-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.unranked-title{font-size:14px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.unranked-items{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;padding:4px;border-radius:8px;transition:background .2s}
.unranked-items.drag-over{background:rgba(0,229,255,.08);outline:2px dashed var(--accent)}

/* ── ITEM ── */
.tier-item{width:64px;height:64px;border-radius:8px;overflow:visible;position:relative;cursor:grab;user-select:none;background:var(--surface2);border:2px solid transparent;transition:all .15s;flex-shrink:0}
.tier-item:hover{border-color:var(--accent)}
.tier-item.dragging{opacity:.4;transform:scale(.9)}
.tier-item-inner{width:100%;height:100%;border-radius:6px;overflow:hidden;position:relative}
.tier-item img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.tier-item .item-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:9px;padding:2px 3px;text-align:center;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
/* ── ITEM CONTEXT MODAL ── */
.item-context-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:250;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.item-context-overlay.active{opacity:1;pointer-events:auto}
.item-context-sheet{background:var(--surface);border:1px solid var(--surface3);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:400px;transform:translateY(100%);transition:transform .25s}
.item-context-overlay.active .item-context-sheet{transform:translateY(0)}
.item-context-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--surface3)}
.item-context-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--surface2);flex-shrink:0;cursor:pointer;position:relative}
.item-context-thumb img{width:100%;height:100%;object-fit:cover}
.item-context-thumb .zoom-hint{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity .15s}
.item-context-thumb:hover .zoom-hint{opacity:1}
.fullscreen-img{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;cursor:zoom-out}
.fullscreen-img.active{opacity:1;pointer-events:auto}
.fullscreen-img img{max-width:95%;max-height:95%;object-fit:contain;border-radius:8px}
.item-context-name{font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-context-actions{display:flex;flex-direction:column;gap:8px}
.item-context-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:500;transition:background .15s;width:100%;text-align:left}
.item-context-btn:hover{background:var(--surface2)}
.item-context-btn .ctx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-context-btn.edit-ctx .ctx-icon{background:rgba(0,229,255,.15);color:var(--accent)}
.item-context-btn.delete-ctx .ctx-icon{background:rgba(255,23,68,.15);color:var(--s)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--surface3);border-radius:16px;padding:24px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translateY(20px);transition:transform .25s}
.modal-overlay.active .modal{transform:translateY(0)}
.modal h2{font-size:20px;margin-bottom:16px}
.modal-field{margin-bottom:16px}
.modal-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.modal-field input,.modal-field select{width:100%}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.img-preview-container{margin-top:8px;display:none;align-items:flex-start;gap:12px}
.img-preview-container.visible{display:flex}
.img-preview{width:80px;height:80px;border-radius:10px;border:2px solid var(--surface3);flex-shrink:0;overflow:hidden}
.img-preview img{width:100%;height:100%}
.img-fit-options{display:flex;flex-direction:column;gap:6px}
.img-fit-options label{font-size:12px;color:var(--text2);margin-bottom:0;display:flex;align-items:center;gap:6px;cursor:pointer}
.img-fit-options input[type="radio"]{accent-color:var(--accent);width:auto;padding:0}
.file-label{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface2);border:1px solid var(--surface3);border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s}
.file-label:hover{border-color:var(--accent)}

.export-canvas{position:fixed;top:-9999px;left:-9999px}

/* ── TOAST ── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border:1px solid var(--surface3);padding:10px 20px;border-radius:10px;font-size:14px;z-index:300;transition:transform .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}

.drag-ghost{position:fixed;z-index:999;pointer-events:none;width:64px;height:64px;border-radius:8px;overflow:hidden;box-shadow:0 8px 32px rgba(0,229,255,.3);border:2px solid var(--accent);transform:translate(-50%,-50%);transition:none}
.drag-ghost img{width:100%;height:100%;object-fit:cover}

@media(max-width:500px){
  .list-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tier-label{width:44px;min-width:44px;font-size:18px}
  .tier-item{width:52px;height:52px}
  .tier-item .item-name{font-size:8px}
  .item-context-sheet{max-width:100%;border-radius:14px 14px 0 0}
}
</style>
</head>
<body>

<div id="homeScreen">
  <div class="app-header">
    <h1>TierList</h1>
  </div>
  <div class="home">
    <div class="home-title">Le tue Tier List</div>
    <div class="home-subtitle">Crea e organizza le tue classifiche</div>
    <div class="list-grid" id="listGrid"></div>
  </div>
</div>

<div class="tier-view" id="tierView">
  <div class="tier-header">
    <button class="btn-icon back" id="backBtn">←</button>
    <input class="tier-title-input" id="tierTitleInput" placeholder="Nome tier list...">
    <button class="btn btn-secondary" id="exportBtn">📸</button>
    <button class="btn btn-primary" id="addItemBtn">+ Aggiungi</button>
  </div>
  <div class="tier-container" id="tierContainer">
    <div id="tierRows"></div>
    <div class="unranked" id="unrankedArea">
      <div class="unranked-header">
        <span class="unranked-title">Non classificati</span>
      </div>
      <div class="unranked-items" id="unrankedItems" data-tier="unranked"></div>
    </div>
  </div>
</div>

<!-- Modal: New List -->
<div class="modal-overlay" id="newListModal">
  <div class="modal">
    <h2>Nuova Tier List</h2>
    <div class="modal-field">
      <label>Nome</label>
      <input id="newListName" placeholder="es. Videogiochi, Anime, Film...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('newListModal')">Annulla</button>
      <button class="btn btn-primary" id="createListBtn">Crea</button>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit Item -->
<div class="modal-overlay" id="addItemModal">
  <div class="modal">
    <h2 id="itemModalTitle">Aggiungi Elemento</h2>
    <div class="modal-field">
      <label>Nome</label>
      <input id="itemName" placeholder="es. Dark Souls, Naruto...">
    </div>
    <div class="modal-field">
      <label>Immagine</label>
      <label class="file-label">
        📁 Scegli immagine
        <input type="file" id="itemImage" accept="image/*" hidden>
      </label>
      <div class="img-preview-container" id="imgPreviewContainer">
        <div class="img-preview" id="imgPreview"></div>
        <div class="img-fit-options">
          <span style="font-size:12px;color:var(--text2);font-weight:600">Inquadratura:</span>
          <label><input type="radio" name="imgFit" value="cover" checked> Riempi (taglia)</label>
          <label><input type="radio" name="imgFit" value="contain"> Adatta (mostra tutto)</label>
          <label><input type="radio" name="imgFit" value="fill"> Allunga</label>
        </div>
      </div>
    </div>
    <div class="modal-field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text)">
        <input type="checkbox" id="itemShowName" style="accent-color:var(--accent);width:18px;height:18px">
        Mostra nome sull'anteprima
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addItemModal')">Annulla</button>
      <button class="btn btn-primary" id="saveItemBtn">Aggiungi</button>
    </div>
  </div>
</div>

<!-- Modal: Rename List -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h2>Rinomina Tier List</h2>
    <div class="modal-field">
      <label>Nuovo nome</label>
      <input id="renameInput">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('renameModal')">Annulla</button>
      <button class="btn btn-primary" id="renameConfirmBtn">Salva</button>
    </div>
  </div>
</div>

<!-- Modal: Item Context (edit/delete) -->
<div class="item-context-overlay" id="itemContextOverlay">
  <div class="item-context-sheet">
    <div class="item-context-header">
      <div class="item-context-thumb" id="ctxThumb"></div>
      <div class="item-context-name" id="ctxName"></div>
    </div>
    <div class="item-context-actions">
      <button class="item-context-btn view-ctx" id="ctxViewBtn" style="display:none"><span class="ctx-icon" style="background:rgba(124,77,255,.15);color:var(--accent2)">🔍</span>Vedi immagine</button>
      <button class="item-context-btn edit-ctx" id="ctxEditBtn"><span class="ctx-icon">✎</span>Modifica</button>
      <button class="item-context-btn delete-ctx" id="ctxDeleteBtn"><span class="ctx-icon">🗑</span>Elimina</button>
    </div>
  </div>
</div>

<div class="fullscreen-img" id="fullscreenImg"><img id="fullscreenImgSrc"></div>
<div class="toast" id="toast"></div>
<canvas class="export-canvas" id="exportCanvas"></canvas>

<script>
const TIERS = ['S','A','B','C','D'];
const TIER_COLORS = {S:'#ff1744',A:'#ff9100',B:'#ffea00',C:'#69f0ae',D:'#448aff'};
let data = JSON.parse(localStorage.getItem('tierlist_data') || '{"lists":[]}');
let currentListId = null;
let dragItem = null;
let dragGhost = null;
let touchStartX = 0, touchStartY = 0;
let editingItemId = null;
let pendingImgData = null;

function save() { localStorage.setItem('tierlist_data', JSON.stringify(data)); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function getList() { return data.lists.find(l => l.id === currentListId); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ── MODALS ──
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ── HOME SCREEN ──
function renderHome() {
  const grid = document.getElementById('listGrid');
  grid.innerHTML = '';
  data.lists.forEach(list => {
    const count = list.items ? list.items.length : 0;
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="list-card-actions">
        <button class="rename-btn" data-id="${list.id}" title="Rinomina">✏️</button>
        <button class="delete-list-btn" data-id="${list.id}" title="Elimina">🗑️</button>
      </div>
      <div class="list-card-name">${esc(list.name)}</div>
      <div class="list-card-count">${count} element${count !== 1 ? 'i' : 'o'}</div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.rename-btn') || e.target.closest('.delete-list-btn')) return;
      openList(list.id);
    });
    card.querySelector('.rename-btn').addEventListener('click', (e) => { e.stopPropagation(); startRename(list.id); });
    card.querySelector('.delete-list-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteList(list.id); });
    grid.appendChild(card);
  });
  const add = document.createElement('div');
  add.className = 'list-card add-card';
  add.innerHTML = '<span class="plus">+</span><span>Nuova Lista</span>';
  add.addEventListener('click', () => {
    document.getElementById('newListName').value = '';
    openModal('newListModal');
    setTimeout(() => document.getElementById('newListName').focus(), 100);
  });
  grid.appendChild(add);
}

// ── LIST CRUD ──
document.getElementById('createListBtn').addEventListener('click', () => {
  const name = document.getElementById('newListName').value.trim();
  if (!name) return;
  const list = { id: genId(), name, items: [], tiers: { S:[], A:[], B:[], C:[], D:[], unranked:[] } };
  data.lists.push(list);
  save();
  closeModal('newListModal');
  renderHome();
  toast('Lista creata!');
});
document.getElementById('newListName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('createListBtn').click();
});

function deleteList(id) {
  if (!confirm('Eliminare questa tier list?')) return;
  data.lists = data.lists.filter(l => l.id !== id);
  save();
  renderHome();
  toast('Lista eliminata');
}

let renameListId = null;
function startRename(id) {
  renameListId = id;
  const list = data.lists.find(l => l.id === id);
  document.getElementById('renameInput').value = list.name;
  openModal('renameModal');
  setTimeout(() => document.getElementById('renameInput').focus(), 100);
}
document.getElementById('renameConfirmBtn').addEventListener('click', () => {
  const name = document.getElementById('renameInput').value.trim();
  if (!name) return;
  const list = data.lists.find(l => l.id === renameListId);
  if (list) { list.name = name; save(); renderHome(); }
  closeModal('renameModal');
});
document.getElementById('renameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('renameConfirmBtn').click();
});

// ── TIER VIEW ──
function openList(id) {
  currentListId = id;
  const list = getList();
  if (!list.tiers) list.tiers = { S:[], A:[], B:[], C:[], D:[], unranked:[] };
  document.getElementById('tierTitleInput').value = list.name;
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('tierView').classList.add('active');
  renderTiers();
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('tierView').classList.remove('active');
  document.getElementById('homeScreen').style.display = '';
  currentListId = null;
  renderHome();
});

document.getElementById('tierTitleInput').addEventListener('input', () => {
  const list = getList();
  if (list) { list.name = document.getElementById('tierTitleInput').value; save(); }
});

function renderTiers() {
  const list = getList();
  if (!list) return;
  const rows = document.getElementById('tierRows');
  rows.innerHTML = '';
  TIERS.forEach(tier => {
    const row = document.createElement('div');
    row.className = 'tier-row';
    row.innerHTML = `<div class="tier-label" data-tier="${tier}">${tier}</div>`;
    const items = document.createElement('div');
    items.className = 'tier-items';
    items.dataset.tier = tier;
    (list.tiers[tier] || []).forEach(itemId => {
      const item = list.items.find(i => i.id === itemId);
      if (item) items.appendChild(createItemEl(item));
    });
    setupDropZone(items);
    row.appendChild(items);
    rows.appendChild(row);
  });
  const unranked = document.getElementById('unrankedItems');
  unranked.innerHTML = '';
  (list.tiers.unranked || []).forEach(itemId => {
    const item = list.items.find(i => i.id === itemId);
    if (item) unranked.appendChild(createItemEl(item));
  });
  setupDropZone(unranked);
}

function createItemEl(item) {
  const el = document.createElement('div');
  el.className = 'tier-item';
  el.dataset.id = item.id;
  el.draggable = true;
  const fit = item.fit || 'cover';
  el.innerHTML = `
    <div class="item-inner" style="width:100%;height:100%;border-radius:6px;overflow:hidden;position:relative">
      ${item.img ? `<img src="${item.img}" alt="${esc(item.name)}" style="object-fit:${fit}">` : ''}
      ${item.showName ? `<div class="item-name">${esc(item.name)}</div>` : ''}
    </div>
  `;
  el.addEventListener('click', (e) => {
    if (el.classList.contains('dragging')) return;
    e.stopPropagation();
    openItemContext(item.id);
  });
  el.addEventListener('dragstart', (e) => {
    dragItem = item.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', item.id);
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    dragItem = null;
    clearPlaceholders();
  });
  el.addEventListener('touchstart', handleTouchStart, { passive: false });
  el.addEventListener('touchmove', handleTouchMove, { passive: false });
  el.addEventListener('touchend', handleTouchEnd);
  return el;
}

// ── ITEM CONTEXT MODAL ──
let contextItemId = null;
function openItemContext(id) {
  const list = getList();
  const item = list.items.find(i => i.id === id);
  if (!item) return;
  contextItemId = id;
  document.getElementById('ctxName').textContent = item.name;
  const thumb = document.getElementById('ctxThumb');
  thumb.innerHTML = item.img ? `<img src="${item.img}"><span class="zoom-hint">🔍</span>` : '';
  const showFullscreen = () => {
    document.getElementById('fullscreenImgSrc').src = item.img;
    document.getElementById('fullscreenImg').classList.add('active');
  };
  thumb.onclick = item.img ? showFullscreen : null;
  const viewBtn = document.getElementById('ctxViewBtn');
  if (item.img) { viewBtn.style.display = ''; viewBtn.onclick = showFullscreen; }
  else { viewBtn.style.display = 'none'; }
  document.getElementById('itemContextOverlay').classList.add('active');
}
function closeItemContext() {
  document.getElementById('itemContextOverlay').classList.remove('active');
  contextItemId = null;
}
document.getElementById('itemContextOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('itemContextOverlay')) closeItemContext();
});
document.getElementById('fullscreenImg').addEventListener('click', () => {
  document.getElementById('fullscreenImg').classList.remove('active');
});
document.getElementById('ctxEditBtn').addEventListener('click', () => {
  const id = contextItemId;
  closeItemContext();
  setTimeout(() => openEditItem(id), 150);
});
document.getElementById('ctxDeleteBtn').addEventListener('click', () => {
  const id = contextItemId;
  closeItemContext();
  deleteItem(id);
});

// ── EDIT ITEM ──
function openEditItem(id) {
  const list = getList();
  const item = list.items.find(i => i.id === id);
  if (!item) return;
  editingItemId = id;
  pendingImgData = item.img || null;
  document.getElementById('itemModalTitle').textContent = 'Modifica Elemento';
  document.getElementById('itemName').value = item.name;
  document.getElementById('itemImage').value = '';
  document.getElementById('saveItemBtn').textContent = 'Salva';
  document.getElementById('itemShowName').checked = !!item.showName;
  const container = document.getElementById('imgPreviewContainer');
  const preview = document.getElementById('imgPreview');
  if (item.img) {
    const fit = item.fit || 'cover';
    preview.innerHTML = `<img src="${item.img}" style="object-fit:${fit}">`;
    container.classList.add('visible');
    const radio = document.querySelector(`input[name="imgFit"][value="${fit}"]`);
    if (radio) radio.checked = true;
  } else {
    preview.innerHTML = '';
    container.classList.remove('visible');
  }
  openModal('addItemModal');
  setTimeout(() => document.getElementById('itemName').focus(), 100);
}

// ── DRAG & DROP ──
function setupDropZone(zone) {
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const itemId = e.dataTransfer.getData('text/plain');
    if (itemId) {
      const insertIdx = getInsertIndex(zone, e.clientX);
      moveItem(itemId, zone.dataset.tier, insertIdx);
    }
  });
}

function getInsertIndex(zone, x) {
  const items = [...zone.querySelectorAll('.tier-item:not(.dragging)')];
  for (let i = 0; i < items.length; i++) {
    const rect = items[i].getBoundingClientRect();
    if (x < rect.left + rect.width / 2) return i;
  }
  return items.length;
}

function getInsertIndexXY(zone, x, y) {
  const items = [...zone.querySelectorAll('.tier-item:not(.dragging)')];
  for (let i = 0; i < items.length; i++) {
    const rect = items[i].getBoundingClientRect();
    if (x < rect.left + rect.width / 2) return i;
  }
  return items.length;
}

function moveItem(itemId, toTier, insertIdx) {
  const list = getList();
  if (!list) return;
  Object.keys(list.tiers).forEach(t => {
    list.tiers[t] = list.tiers[t].filter(id => id !== itemId);
  });
  if (!list.tiers[toTier]) list.tiers[toTier] = [];
  if (insertIdx !== undefined && insertIdx < list.tiers[toTier].length) {
    list.tiers[toTier].splice(insertIdx, 0, itemId);
  } else {
    list.tiers[toTier].push(itemId);
  }
  save();
  renderTiers();
}

function clearPlaceholders() {
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

// ── TOUCH DRAG ──
let touchDragging = false;
let touchMoved = false;

function handleTouchStart(e) {
  const el = e.currentTarget;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchDragging = false;
  touchMoved = false;
  dragItem = el.dataset.id;
  el._touchTimeout = setTimeout(() => {
    touchDragging = true;
    el.classList.add('dragging');
    createGhostEl(el, touch.clientX, touch.clientY);
  }, 300);
}

function handleTouchMove(e) {
  const el = e.currentTarget;
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartX);
  const dy = Math.abs(touch.clientY - touchStartY);
  if (dx < 8 && dy < 8) return;
  touchMoved = true;
  e.preventDefault();
  if (!touchDragging) {
    clearTimeout(el._touchTimeout);
    touchDragging = true;
    el.classList.add('dragging');
    createGhostEl(el, touch.clientX, touch.clientY);
  }
  if (dragGhost) {
    dragGhost.style.left = touch.clientX + 'px';
    dragGhost.style.top = touch.clientY + 'px';
  }
  highlightDropZone(touch.clientX, touch.clientY);
}

function handleTouchEnd(e) {
  const el = e.currentTarget;
  clearTimeout(el._touchTimeout);
  if (!touchMoved && !touchDragging) {
    openItemContext(el.dataset.id);
    dragItem = null;
    return;
  }
  el.classList.remove('dragging');
  removeGhost();
  if (touchDragging && dragItem) {
    const touch = e.changedTouches[0];
    const zone = getDropZone(touch.clientX, touch.clientY);
    if (zone) {
      const insertIdx = getInsertIndexXY(zone, touch.clientX, touch.clientY);
      moveItem(dragItem, zone.dataset.tier, insertIdx);
    }
  }
  dragItem = null;
  touchDragging = false;
  touchMoved = false;
  clearPlaceholders();
}

function createGhostEl(el, x, y) {
  removeGhost();
  dragGhost = document.createElement('div');
  dragGhost.className = 'drag-ghost';
  const img = el.querySelector('img');
  if (img) dragGhost.innerHTML = `<img src="${img.src}">`;
  else dragGhost.style.background = 'var(--surface3)';
  dragGhost.style.left = x + 'px';
  dragGhost.style.top = y + 'px';
  document.body.appendChild(dragGhost);
}

function removeGhost() {
  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
}

function getDropZone(x, y) {
  const zones = document.querySelectorAll('.tier-items, .unranked-items');
  for (const z of zones) {
    const r = z.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return z;
  }
  return null;
}

function highlightDropZone(x, y) {
  clearPlaceholders();
  const zone = getDropZone(x, y);
  if (zone) zone.classList.add('drag-over');
}

// ── ADD ITEM MODAL ──
document.getElementById('addItemBtn').addEventListener('click', () => {
  editingItemId = null;
  pendingImgData = null;
  document.getElementById('itemModalTitle').textContent = 'Aggiungi Elemento';
  document.getElementById('itemName').value = '';
  document.getElementById('itemImage').value = '';
  document.getElementById('saveItemBtn').textContent = 'Aggiungi';
  document.getElementById('itemShowName').checked = false;
  document.getElementById('imgPreview').innerHTML = '';
  document.getElementById('imgPreviewContainer').classList.remove('visible');
  document.querySelector('input[name="imgFit"][value="cover"]').checked = true;
  openModal('addItemModal');
  setTimeout(() => document.getElementById('itemName').focus(), 100);
});

document.getElementById('itemImage').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImgData = reader.result;
    updateImgPreview();
  };
  reader.readAsDataURL(file);
});

document.querySelectorAll('input[name="imgFit"]').forEach(r => {
  r.addEventListener('change', updateImgPreview);
});

function updateImgPreview() {
  const container = document.getElementById('imgPreviewContainer');
  const preview = document.getElementById('imgPreview');
  const fit = document.querySelector('input[name="imgFit"]:checked').value;
  const src = pendingImgData;
  if (src) {
    preview.innerHTML = `<img src="${src}" style="object-fit:${fit}">`;
    container.classList.add('visible');
  }
}

document.getElementById('saveItemBtn').addEventListener('click', () => {
  const name = document.getElementById('itemName').value.trim();
  if (!name) return;
  const list = getList();
  const fit = document.querySelector('input[name="imgFit"]:checked').value;
  const showName = document.getElementById('itemShowName').checked;
  const file = document.getElementById('itemImage').files[0];

  const finishSave = (imgData) => {
    if (editingItemId) {
      const item = list.items.find(i => i.id === editingItemId);
      if (item) {
        item.name = name;
        item.fit = fit;
        item.showName = showName;
        if (imgData !== undefined) item.img = imgData;
      }
      save();
      closeModal('addItemModal');
      renderTiers();
      toast('Elemento modificato!');
    } else {
      const item = { id: genId(), name, img: imgData || '', fit, showName };
      list.items.push(item);
      if (!list.tiers.unranked) list.tiers.unranked = [];
      list.tiers.unranked.push(item.id);
      save();
      closeModal('addItemModal');
      renderTiers();
      toast('Elemento aggiunto!');
    }
    editingItemId = null;
    pendingImgData = null;
  };

  if (file) {
    compressImage(file, (dataUrl) => finishSave(dataUrl));
  } else if (editingItemId && pendingImgData) {
    finishSave(undefined);
  } else {
    finishSave('');
  }
});

document.getElementById('itemName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('saveItemBtn').click();
});

function compressImage(file, cb) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    const MAX = 200;
    let w = img.width, h = img.height;
    if (w > h) { h = h * MAX / w; w = MAX; }
    else { w = w * MAX / h; h = MAX; }
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.src = URL.createObjectURL(file);
}

function deleteItem(id) {
  const list = getList();
  list.items = list.items.filter(i => i.id !== id);
  Object.keys(list.tiers).forEach(t => {
    list.tiers[t] = list.tiers[t].filter(i => i !== id);
  });
  save();
  renderTiers();
  toast('Elemento rimosso');
}

// ── EXPORT ──
document.getElementById('exportBtn').addEventListener('click', exportAsImage);

async function exportAsImage() {
  const list = getList();
  if (!list) return;
  toast('Esportazione in corso...');
  const canvas = document.getElementById('exportCanvas');
  const ctx = canvas.getContext('2d');
  const W = 800, ROW_H = 80, LABEL_W = 60, ITEM_SIZE = 64, PAD = 8, HEADER_H = 50;
  const H = HEADER_H + TIERS.length * ROW_H + 20;
  canvas.width = W;
  canvas.height = H;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e8e8f0';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.fillText(list.name, 16, 34);

  let y = HEADER_H;
  for (const tier of TIERS) {
    ctx.fillStyle = TIER_COLORS[tier];
    ctx.fillRect(0, y, LABEL_W, ROW_H);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tier, LABEL_W / 2, y + ROW_H / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#14141f';
    ctx.fillRect(LABEL_W, y, W - LABEL_W, ROW_H);
    const items = (list.tiers[tier] || []).map(id => list.items.find(i => i.id === id)).filter(Boolean);
    let x = LABEL_W + PAD;
    for (const item of items) {
      if (item.img) {
        try {
          const img = await loadImg(item.img);
          ctx.drawImage(img, x, y + PAD, ITEM_SIZE, ITEM_SIZE);
        } catch(_) {
          ctx.fillStyle = '#282840';
          ctx.fillRect(x, y + PAD, ITEM_SIZE, ITEM_SIZE);
        }
      } else {
        ctx.fillStyle = '#282840';
        ctx.fillRect(x, y + PAD, ITEM_SIZE, ITEM_SIZE);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(x, y + PAD + ITEM_SIZE - 16, ITEM_SIZE, 16);
      ctx.fillStyle = '#fff';
      ctx.font = '9px -apple-system, sans-serif';
      const label = item.name.length > 10 ? item.name.slice(0,9) + '…' : item.name;
      ctx.fillText(label, x + 3, y + PAD + ITEM_SIZE - 4);
      x += ITEM_SIZE + 6;
    }
    y += ROW_H;
  }
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tierlist-${list.name.replace(/\s+/g,'-')}.png`;
    a.click();
    URL.revokeObjectURL(url);
    toast('Immagine scaricata!');
  });
}

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

renderHome();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
